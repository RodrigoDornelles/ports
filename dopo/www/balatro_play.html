<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Balatro</title>
  <meta name="description" content="Your own Balatro, kept on this device.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Balatro">
  <link rel="icon" href="{{root}}favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{root}}favicon-32x32.png">
  <link rel="apple-touch-icon" href="../icon-192x192.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* love.js's own spinner gives way to a loading screen like PrBoomTV's */
    #spinner { display: none !important; }
    /* the game is the page's size: Emscripten pins the canvas to the
     * window's first size in pixels, and its SDL resizes the game to the
     * canvas's size in CSS, so turning a phone reaches love.resize */
    #canvas {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
    }
    /* Balatro only plays lying down: a standing page (a phone with its
     * rotation locked) gets the game turned a quarter, to be held sideways */
    @media (orientation: portrait) {
      #canvas {
        top: 0;
        left: 100vw;
        width: 100vh !important;
        width: 100dvh !important;
        height: 100vw !important;
        transform: rotate(90deg);
        transform-origin: top left;
      }
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: #0d0b0a;
      color: #9a8a7e;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    #loading[hidden] { display: none; }
    #loading img {
      display: block;
      width: min(640px, 100%, 120vh);
      aspect-ratio: 320 / 200;
      image-rendering: pixelated;
    }
    #status { margin: 0; }
    #status.error { color: #e8b04a; }
    #loading a {
      padding: 10px 28px;
      border-radius: 6px;
      background: #d6402b;
      color: #fff6ee;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
    }
    #loading a[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="spinner" class="pending"></div>
  <div id="loading">
    <img src="../banner.png" alt="">
    <p id="status">Loading Balatro...</p>
    <a id="choose" href="../" hidden>Choose your copy</a>
  </div>
  <script>
    /* installed or not, love.js is kept on this device for the next start;
     * the first time, the worker also takes what loaded before it */
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register('sw.js')
        .then(() => navigator.serviceWorker.ready)
        .then((registration) => registration.active.postMessage({
          cache: [location.href.split('#')[0],
                  ...performance.getEntriesByType('resource').map((entry) => entry.name)],
        }))
        .catch((e) => console.warn('[balatro] cache:', e));
    }

    /* Emscripten sizes the game and places taps by the canvas's box on the
     * page and the events' clientX/clientY: turned, the canvas answers with
     * its own box, lying down, and every mouse and touch event, before it
     * reaches the game, has its point turned into that box */
    const canvas = document.getElementById('canvas');
    const portrait = matchMedia('(orientation: portrait)');
    const pageRect = () => Element.prototype.getBoundingClientRect.call(canvas);
    canvas.getBoundingClientRect = () => {
      if (!portrait.matches) return pageRect();
      const width = canvas.offsetWidth, height = canvas.offsetHeight;
      return { left: 0, top: 0, x: 0, y: 0, right: width, bottom: height, width, height };
    };
    const original = (proto, key) => Object.getOwnPropertyDescriptor(proto, key).get;
    const turn = (point, proto) => {
      const rect = pageRect();
      const x = original(proto, 'clientX').call(point);
      const y = original(proto, 'clientY').call(point);
      Object.defineProperty(point, 'clientX', { value: y - rect.top, configurable: true });
      Object.defineProperty(point, 'clientY', { value: rect.right - x, configurable: true });
    };
    const turnMouse = (e) => { if (portrait.matches) turn(e, MouseEvent.prototype); };
    const turnTouch = (e) => {
      if (!portrait.matches) return;
      for (const list of [e.touches, e.changedTouches, e.targetTouches]) {
        for (const touch of list) turn(touch, Touch.prototype);
      }
    };
    for (const type of ['mousedown', 'mouseup', 'mousemove', 'wheel']) {
      window.addEventListener(type, turnMouse, true);
    }
    if (window.TouchEvent) {
      for (const type of ['touchstart', 'touchend', 'touchmove', 'touchcancel']) {
        window.addEventListener(type, turnTouch, true);
      }
    }
    /* turning the page turns the canvas: the game is told of its new size */
    portrait.addEventListener('change', () => window.dispatchEvent(new Event('resize')));

    const status = document.getElementById('status');
    const missing = () => {
      status.textContent = 'Balatro is not on this device yet: choose your copy first.';
      document.getElementById('choose').hidden = false;
    };

    /* love.js marks its spinner '' once the game draws, 'error' if it fails */
    new MutationObserver(() => {
      const state = document.getElementById('spinner').className;
      if (state === '') {
        document.getElementById('loading').hidden = true;
        /* the game starts at its own size: fit it to the page */
        window.dispatchEvent(new Event('resize'));
      } else if (state === 'error') {
        status.textContent = 'Balatro could not start.';
        status.classList.add('error');
      }
    }).observe(document.getElementById('spinner'), { attributes: true, attributeFilter: ['class'] });

    /* the game is the one the Balatro page left in love.js's own store,
     * where its player looks first */
    const open = indexedDB.open('EM_PRELOAD_CACHE', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('PACKAGES');
    open.onerror = missing;
    open.onsuccess = () => {
      const db = open.result;
      const get = db.transaction('PACKAGES').objectStore('PACKAGES').get('Balatro.love');
      get.onsuccess = () => {
        db.close();
        if (!get.result) {
          missing();
          return;
        }
        const player = document.createElement('script');
        player.src = 'player.js?g=Balatro.love';
        document.body.append(player);
      };
    };
  </script>
</body>
</html>
