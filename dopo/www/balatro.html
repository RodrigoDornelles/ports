<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balatro Patcher</title>
  <meta name="description" content="Patch your own copy of Balatro for TV boxes and handhelds, in the browser.">
  <style>
    :root {
      --bg: #0d0b0a;
      --panel: #1a1513;
      --line: #3a2d27;
      --text: #e9e0d6;
      --muted: #9a8a7e;
      --accent: #d6402b;
      --accent-text: #fff6ee;
      --ok: #e8b04a;
      --error: #ff7a66;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    .back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--text); }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 span { color: var(--accent); }

    .lead { margin: 0 0 24px; color: var(--muted); text-wrap: pretty; }

    .toolbar {
      display: flex;
      gap: 8px;
    }

    .file {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 6px 0 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      cursor: pointer;
    }

    .file:hover, .file.over { border-color: var(--accent); }
    .file:focus-within { outline: 2px solid var(--ok); outline-offset: 2px; }
    .file.loaded { border-color: var(--ok); }
    .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .file .pick {
      padding: 10px 14px;
      border-right: 1px solid var(--line);
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
    }

    .file .name {
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file.loaded .name { color: var(--text); }

    .status { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .status.error { color: var(--error); }

    h2 { margin: 20px 0 10px; font-size: 18px; }

    .patchs {
      margin: 0;
      padding: 0;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }

    .patchs li + li { border-top: 1px solid var(--line); }

    .patchs label {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 12px;
      padding: 12px 16px;
      cursor: pointer;
    }

    .patchs input {
      grid-row: span 3;
      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      accent-color: var(--accent);
    }

    .patchs .title { font-weight: 600; }
    .patchs .description { color: var(--muted); font-size: 14px; }
    .patchs .conflict { color: var(--ok); font-size: 13px; }

    select, button {
      font: inherit;
      border-radius: 6px;
    }

    select {
      min-width: 160px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
    }

    button {
      padding: 10px 24px;
      border: 0;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    select:focus-visible, button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

    @media (max-width: 520px) {
      .toolbar { flex-wrap: wrap; }
      .file { flex-basis: 100%; }
      select { min-width: 0; flex: 1; }
      button { flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">&larr; Dornelles Ports</a>
    <h1><span>Balatro</span> Patcher</h1>
    <p class="lead">Lighter Balatro <span id="version"></span> for TV boxes and handhelds. Bring your own copy: it is patched here, in your browser, and never leaves your computer.</p>

    <div class="toolbar">
      <label class="file" id="drop">
        <input type="file" id="file" accept=".exe,.love">
        <span class="pick">Choose file</span>
        <span class="name" id="file-name">Balatro.exe or Balatro.love, or drop it here</span>
      </label>
      <select id="format" aria-label="Format">
        <option value="love">.love</option>
        <option value="ipk-zapper" disabled>.ipk (Zapper)</option>
        <option value="ipk-webos" disabled>.ipk (webOS)</option>
      </select>
      <button id="download" disabled>Download</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <h2>Patches</h2>
    <ul class="patchs" id="patchs"></ul>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="patchs.js"></script>
  <script type="module">
    import { GAME_VERSION, loadPatchs, findConflicts, openGame, buildLove } from './balatro.js';

    const $ = (id) => document.getElementById(id);
    const status = (text, error = false) => {
      $('status').textContent = text;
      $('status').classList.toggle('error', error);
    };

    $('version').textContent = GAME_VERSION;

    let patchs = [];
    let conflicts = new Map();
    let game = null;
    let busy = false;

    const checkbox = (name) => $('patchs').querySelector(`input[value="${name}"]`);
    const titleOf = (name) => patchs.find((patch) => patch.name === name).title;
    const refresh = () => {
      $('download').disabled = busy || !game || game.version !== GAME_VERSION;
    };

    // checking a patch unchecks the ones it can not go with
    const choose = (name) => {
      if (!checkbox(name).checked) return;
      for (const other of conflicts.get(name)) checkbox(other).checked = false;
    };

    try {
      patchs = await loadPatchs(location.href);
      conflicts = findConflicts(patchs);
      for (const patch of patchs) {
        const item = document.createElement('li');
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = patch.name;
        // the first of a conflicting pair, in the list's order, starts checked
        input.checked = ![...conflicts.get(patch.name)].some((other) => checkbox(other)?.checked);
        input.addEventListener('change', () => choose(patch.name));
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = patch.title;
        const description = document.createElement('span');
        description.className = 'description';
        description.textContent = patch.description;
        label.append(input, title, description);
        if (conflicts.get(patch.name).size) {
          const conflict = document.createElement('span');
          conflict.className = 'conflict';
          conflict.textContent = 'Not with: ' + [...conflicts.get(patch.name)].map(titleOf).join(', ');
          label.append(conflict);
        }
        item.append(label);
        $('patchs').append(item);
      }
    } catch (error) {
      status(`Could not load the patches: ${error.message}`, true);
    }

    const open = async (file) => {
      if (!file || busy) return;
      game = null;
      $('drop').classList.remove('loaded');
      status(`Reading ${file.name}…`);
      refresh();
      try {
        game = await openGame(await file.arrayBuffer());
        game.name = file.name;
        if (game.version !== GAME_VERSION) {
          status(`This is Balatro ${game.version}; the patches are for ${GAME_VERSION}.`, true);
        } else {
          $('drop').classList.add('loaded');
          $('file-name').textContent = `${file.name} · Balatro ${game.version}`;
          status('Ready: choose the patches and download.');
        }
      } catch (error) {
        game = null;
        status(`${file.name}: ${error.message}`, true);
      }
      refresh();
    };

    $('file').addEventListener('change', () => open($('file').files[0]));
    addEventListener('dragover', (event) => {
      event.preventDefault();
      $('drop').classList.add('over');
    });
    addEventListener('dragleave', (event) => {
      if (!event.relatedTarget) $('drop').classList.remove('over');
    });
    addEventListener('drop', (event) => {
      event.preventDefault();
      $('drop').classList.remove('over');
      open(event.dataTransfer.files[0]);
    });

    $('download').addEventListener('click', async () => {
      const chosen = patchs.filter((patch) => checkbox(patch.name).checked);
      busy = true;
      refresh();
      try {
        const blob = await buildLove(game, chosen,
          (percent) => status(`Packing… ${Math.floor(percent)}%`));
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Balatro.love';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 60000);
        status(`Done: Balatro.love with ${chosen.length} patches, ${(blob.size / 1048576).toFixed(1)} MB.`);
      } catch (error) {
        status(error.message, true);
      }
      busy = false;
      refresh();
    });
  </script>
</body>
</html>
