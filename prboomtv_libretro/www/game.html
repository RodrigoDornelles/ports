<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} - PrBoomTV</title>
  <meta name="description" content="Play {{title}} in the browser with PrBoomTV, alone or with friends.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="Play {{title}} in the browser with PrBoomTV, alone or with friends.">
  <meta property="og:image" content="{{banner}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="prboomtv:content" content="{{content}}">
  <meta name="prboomtv:midi" content="{{midi}}">
  <link rel="manifest" href="{{id}}.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{title}}">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <!-- touch screens: a stick, fire and use, and the menu, over the game
       (gamepadzilla presses the keys RetroArch maps to the RetroPad) -->
  <div class="touch" aria-hidden="true">
    <canvas class="gpz-joy touch-stick" width="128" height="128"
            data-gpz-bind="ArrowUp ArrowLeft ArrowDown ArrowRight"></canvas>
    <canvas class="gpz-btn touch-fire" width="64" height="64" data-gpz-bind="KeyS"
            data-gpz-color="#88888880" data-gpz-color-action="#d6402bc0"></canvas>
    <canvas class="gpz-btn touch-use" width="64" height="64" data-gpz-bind="KeyX"
            data-gpz-color="#88888880" data-gpz-color-action="#e8b04ac0"></canvas>
    <button type="button" class="touch-menu" id="touch-menu">MENU</button>
  </div>
  <button type="button" class="install" id="install" hidden>Install</button>

  <div id="rotate" role="alert">
    <svg class="phone" viewBox="0 0 48 48" width="64" height="64" aria-hidden="true"><rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="38" r="2" fill="currentColor"/></svg>
    <p>Turn your phone sideways to play.</p>
  </div>

  <div id="loading">
    <img class="banner" src="{{banner}}" alt="">
    <p id="status">Loading {{title}}...</p>
  </div>

  <script src="../retroarch/gamepadzilla.js" defer></script>

  <script type="module">
    /* installed or not, the game is kept on this device for the next start;
     * the first time, the worker also takes what loaded before it */
    navigator.serviceWorker?.register('sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then((registration) => registration.active.postMessage({
        cache: [location.href.split('#')[0],
                ...performance.getEntriesByType('resource').map((entry) => entry.name)],
      }))
      .catch((e) => console.warn('[prboomtv] cache:', e));

    import { play, hashParams, coreOptions, loadOptions } from '../retroarch/player.js';

    /* RetroArch hears keys on the canvas; gamepadzilla's (and the menu
     * button's) are made up on window, so they go on to the canvas, not
     * bubbling, so they don't come back here */
    const canvas = document.getElementById('canvas');
    const press = (type, code, key, keyCode) => canvas.dispatchEvent(
      new KeyboardEvent(type, { code, key, keyCode, which: keyCode, bubbles: false, cancelable: true }));
    for (const type of ['keydown', 'keyup'])
      addEventListener(type, (event) => {
        if (!event.isTrusted) press(type, event.code, event.key, event.keyCode);
      });
    const menu = document.getElementById('touch-menu');
    menu.addEventListener('pointerdown', (event) => { event.preventDefault(); press('keydown', 'Enter', 'Enter', 13); });
    for (const type of ['pointerup', 'pointercancel', 'pointerleave'])
      menu.addEventListener(type, () => press('keyup', 'Enter', 'Enter', 13));

    /* installing: the browser's offer, on a button, while not installed */
    const install = document.getElementById('install');
    let offer = null;
    addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      offer = event;
      install.hidden = false;
    });
    install.addEventListener('click', async () => {
      if (!offer) return;
      offer.prompt();
      await offer.userChoice.catch(() => {});
      offer = null;
      install.hidden = true;
    });
    addEventListener('appinstalled', () => { install.hidden = true; });

    const title = document.querySelector('meta[property="og:title"]').content;
    const content = document.querySelector('meta[name="prboomtv:content"]').content;
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');

    const defaults = await loadOptions('defaults.txt').catch((e) => {
      console.warn('[prboomtv]', e);
      return {};
    });

    /* #music=<file> plays the MIDI on that SoundFont of midi.json, the
     * index's Music field: the bank joins the game's playlist and the core
     * takes it from there; without it, the original OPL */
    async function soundfont(file) {
      const midi = document.querySelector('meta[name="prboomtv:midi"]').content;
      if (!file || !midi) return [];
      try {
        const response = await fetch(midi);
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        for (const bank of await response.json()) {
          if (!bank?.url) continue;
          const url = new URL(bank.url, response.url);
          if (decodeURIComponent(url.pathname.split('/').pop()) === file) return [url.href];
        }
        throw new Error(`no ${file} in it`);
      } catch (e) {
        console.warn('[prboomtv] midi.json:', e);
        return [];
      }
    }

    /* the sound starts with the first key or click: browsers hold audio
     * back until the page is interacted with */
    play({
      canvas,
      core: 'prboomtv_libretro.js',
      content,
      playlist: await soundfont(hashParams().get('music')),
      options: { ...defaults, ...coreOptions() },
      nick: hashParams().get('nick') || '',
      progress: (loaded, total) => {
        if (total) status.textContent = `Loading ${title}... ${Math.min(100, Math.round(loaded * 100 / total))}%`;
      },
    }).then(() => loading.remove(), (e) => {
      console.error(e);
      status.classList.add('error');
      status.textContent = `Could not start: ${e.message ?? e}`;
    });
  </script>
</body>
</html>
